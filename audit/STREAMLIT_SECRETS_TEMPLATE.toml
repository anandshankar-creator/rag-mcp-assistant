# ==============================================================================
# Streamlit Community Cloud: Secrets Configuration Template
# File: .streamlit/secrets.toml (Configure in Streamlit Cloud App Settings)
# ==============================================================================
# IMPORTANT:
# - This template contains PLACEHOLDER VALUES ONLY.
# - Never commit real API keys, passwords, or OAuth tokens to Git.
# - Copy these sections into your Streamlit Cloud Dashboard:
#   Settings -> Secrets
# ==============================================================================

# --- 1. LLM API Keys & Provider Settings ---
LLM_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-flash-lite-latest"

# Primary Gemini API Key (Required for live chat and document synthesis)
GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"

# Optional: Comma-separated keys for automated quota rotation across calls
# GEMINI_API_KEYS = "key_1,key_2,key_3"


# --- 2. Administrator Authentication & Security ---
# Canonical Administrator Email
ADMIN_EMAIL = "sergio759516@gmail.com"

# Initial password (used to seed account if ADMIN_PASSWORD_HASH is empty)
ADMIN_INITIAL_PASSWORD = "YourStrongInitialAdminPassword2026!"

# Optional: Precomputed salted bcrypt password hash (e.g. $2b$12$...)
# If provided, this overrides initial password seeding
# ADMIN_PASSWORD_HASH = "$2b$12$..."

# Cryptographic secret for signing JWT session tokens (generate a long random string)
JWT_SECRET_KEY = "generate-a-secure-random-secret-key-for-jwt-signing"
JWT_ALGORITHM = "HS256"
SESSION_EXPIRE_MINUTES = 120
RESET_TOKEN_EXPIRE_MINUTES = 15

# Public HTTPS URL of your deployed Streamlit Community Cloud application
# Essential for constructing valid single-use Password Reset links
APP_BASE_URL = "https://rag-mcp-assistant-mf654govkzfnjjmmtlgxfqw.streamlit.app"

MAX_LOGIN_ATTEMPTS = 5
LOCKOUT_MINUTES = 15
MAX_RESET_ATTEMPTS = 3


# --- 3. Email Dispatcher Configuration (Option A: Direct Gmail SMTP) ---
# Recommended for Streamlit Community Cloud: Simple and reliable
# Generate an App Password via Google Account -> Security -> 2-Step Verification -> App passwords
GMAIL_USER = "sergio759516@gmail.com"
GMAIL_APP_PASSWORD = "your_16_digit_google_app_password"


